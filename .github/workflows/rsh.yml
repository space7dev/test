name: rsh
on:
  workflow_dispatch:
    inputs:
      script:
        description: base64 script
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: key
        env:
          K: ${{ secrets.STUDIO_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s' "$K" | base64 -d > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 134.199.245.2 >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: probe
        run: |
          timeout 12 bash -c 'cat </dev/null >/dev/tcp/134.199.245.2/22' && echo TCP22_OK || echo TCP22_FAIL
          timeout 12 curl -sk -o /dev/null -w "https=%{http_code}\n" https://134.199.245.2/ -H 'Host: studio-standby.kgapplabs.com' || echo HTTPS_FAIL
      - name: exec
        env:
          S: ${{ inputs.script }}
        run: |
          echo "$S" | base64 -d > /tmp/s.sh
          timeout 300 ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 root@134.199.245.2 'bash -s' < /tmp/s.sh
