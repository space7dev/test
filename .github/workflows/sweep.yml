name: sweep
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: key
        env:
          K: ${{ secrets.STUDIO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$K" | base64 -d > ~/.ssh/k
          chmod 600 ~/.ssh/k
          head -1 ~/.ssh/k
      - name: wait and exec
        env:
          S: 
        run: |
          echo "$S" | base64 -d > /tmp/s.sh
          T0=$(date +%s)
          OK=0
          for i in $(seq 1 60); do
            if timeout 8 bash -c 'cat </dev/null >/dev/tcp/134.199.245.2/22'; then echo "PORT UP at $(date -u +%H:%M:%S) try $i"; OK=1; break; fi
            echo "try $i $(date -u +%H:%M:%S) down"; sleep 10
          done
          if [ $OK = 0 ]; then echo "HOST_UNREACHABLE after $(($(date +%s)-T0))s"; exit 0; fi
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 root@134.199.245.2 'bash -s' < /tmp/s.sh > /tmp/out.txt 2>&1
          echo "exit=$?"
          wc -l /tmp/out.txt
          cat /tmp/out.txt
      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-out
          path: /tmp/out.txt
          if-no-files-found: ignore
